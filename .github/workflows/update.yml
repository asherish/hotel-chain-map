# Weekly data refresh and GitHub Pages deployment.
#
# If tests or the data pipeline fail, the job stops before the deploy steps,
# so the previously deployed site stays up unchanged.
name: Update data and deploy

on:
  schedule:
    # Upstream All the Places runs start on Saturday and finish by midweek;
    # Thursday morning UTC reliably picks up the completed run.
    - cron: "0 3 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run data pipeline
        run: uv run python -m pipeline

      - name: Commit data changes, if any
        run: |
          if git diff --quiet -- site/data; then
            echo "No data changes; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update hotel data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
